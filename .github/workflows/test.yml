name: Test
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.6

      - name: Set up Python
        run: uv python install

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --doctest-modules --junitxml=junit/test-results.xml --cov=gtfs_utils --cov-report=xml --cov-report=html
