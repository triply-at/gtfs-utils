[project]
name = "gtfsutils"
version = "0.2.5"
description = "Utility library for working with gtfs files"
readme = "README.md"
authors = [
    { name = "Luis Nachtigall", email = "l.nachtigall@triply.at" },
    { name = "Chris Stelzmüller", email = "c.stelzmueller@triply.at" }
]
requires-python = ">=3.10"
dependencies = [
    "dask[dataframe]>=2026.8.0",
    "geopandas>=1.1.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "rich>=15.0.0",
    "shapely>=2.1.2",
    "typer>=0.27.2",
    "typing-extensions>=4.16.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/triply-at/gtfs-utils.git"
Issues = "https://github.com/triply-at/gtfs-utils/issues"


[project.scripts]
gtfs-utils = "gtfs_utils.__main__:main"
gtfsutils = "gtfs_utils.__main__:main"

[project.optional-dependencies]
maps = [
    "folium>=0.20.0",
    "mapclassify>=2.8.1",
    "matplotlib>=3.10.9",
]
yaml = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = "slow: marks tests as slow (deselect with '-m \"not slow\"')"

[tool.setuptools.packages.find]
include = ["gtfs_utils", "gtfs_utils.*"]
